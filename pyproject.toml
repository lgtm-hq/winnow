[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "winnow-media"
version = "0.37.11"
description = "Winnow your media library — organize photos and videos, detect duplicates, and keep the best copies."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "lgtm-hq", email = "turbocoder13@gmail.com" }]
keywords = [
  "media",
  "photos",
  "videos",
  "deduplication",
  "cli",
  "python",
  "image-processing",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Multimedia :: Graphics",
  "Topic :: System :: Filesystems",
]
dependencies = [
  "click>=8.5.1",
  # Not imported yet: #395 parses untrusted XMP packets with
  # defusedxml.ElementTree. Declared now so all dependency changes land
  # together (#409); do not remove it as unused.
  "defusedxml>=0.7.1",
  "exifread>=3.5.1",
  "imagehash>=4.3.2",
  "loguru>=0.8.0",
  "pillow>=13.0.0",
  "pillow-heif>=1.8.1",
  "puremagic>=1.30; python_version < '3.12'",
  "puremagic>=2.3.0; python_version >= '3.12'",
  "pydantic>=2.14.3",
  "rich>=15.0.0",
  "ruamel.yaml>=0.19.1",
  "tinytag>=2.3.2",
]

[project.optional-dependencies]
face = []
ai-detect = []

[project.scripts]
winnow = "winnow.cli:main"

[project.urls]
Homepage = "https://github.com/lgtm-hq/winnow"
Documentation = "https://lgtm-hq.github.io/winnow/"
Source = "https://github.com/lgtm-hq/winnow"
Issues = "https://github.com/lgtm-hq/winnow/issues"

[dependency-groups]
dev = [
  "assertpy>=2.36.1",
  # Python linters lintro runs locally; lintro no longer depends on them
  # (they moved to its "full" extra), so pin them here for `uv sync`.
  "bandit>=1.9.4",
  "black>=26.10.1",
  "hypothesis>=6.170.15",
  "lintro==0.181.3",
  "mypy>=2.4.1",
  "pydoclint>=0.12.0",
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "pyyaml>=6.0.3",
  "ruff>=0.17.5",
  "yamllint>=1.38.0",
]

[tool.hatch.build.targets.wheel]
packages = ["winnow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-m", "not integration"]
markers = [
  "integration: slow end-to-end tests (wheel build, external tools); excluded by default locally, always run in CI",
]

[tool.coverage.run]
source = ["winnow"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.11"
strict = true

# numpy (pulled in transitively by imagehash) ships PEP 695 ``type`` aliases in
# its stubs, which mypy rejects when type-checking against Python 3.11. Skip
# following into numpy so the syntax of its stubs does not gate our own code.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.lintro]
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "C901",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
# House style passes options as keyword-only arguments, which PLR0913 counts;
# 7 keeps legitimate keyword-only APIs passing while still flagging sprawl.
max-args = 7

[[tool.mypy.overrides]]
module = [
  "tests.security.test_sanitization_properties",
  "tests.security.test_path_validator_properties",
]
disallow_untyped_decorators = false
