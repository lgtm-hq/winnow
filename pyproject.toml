[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "winnow-media"
version = "0.13.0"
description = "Winnow your media library — organize photos and videos, detect duplicates, and keep the best copies."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "lgtm-hq", email = "turbocoder13@gmail.com" }]
keywords = [
  "media",
  "photos",
  "videos",
  "deduplication",
  "cli",
  "python",
  "image-processing",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: System :: Filesystems",
]
dependencies = [
  "click>=8.3.3",
  "dynaconf[yaml]>=3.3.2",
  "exifread>=3.0",
  "imagehash>=4.3.1",
  "loguru>=0.7.3",
  "mutagen>=1.47",
  "pillow>=11.0",
  "pillow-heif>=0.18",
  "pydantic>=2.10",
  "rich>=14.0",
  "tinytag>=2.0",
]

[project.optional-dependencies]
face = []
cv = []
ai-detect = []

[project.scripts]
winnow = "winnow.cli:main"

[project.urls]
Homepage = "https://github.com/lgtm-hq/winnow"
Documentation = "https://lgtm-hq.github.io/winnow/"
Source = "https://github.com/lgtm-hq/winnow"
Issues = "https://github.com/lgtm-hq/winnow/issues"

[dependency-groups]
dev = [
  "assertpy>=1.1",
  "hypothesis>=6.0",
  "lintro==0.61.0",
  "mypy>=1.14",
  "pytest>=8.0",
  "pytest-cov>=6.0",
  "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["winnow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-m", "not integration"]
markers = [
  "integration: end-to-end tests that build artifacts or spawn external tools (opt-in)",
]

[tool.coverage.run]
source = ["winnow"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.11"
strict = true

# numpy (pulled in transitively by imagehash) ships PEP 695 ``type`` aliases in
# its stubs, which mypy rejects when type-checking against Python 3.11. Skip
# following into numpy so the syntax of its stubs does not gate our own code.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.lintro]
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[[tool.mypy.overrides]]
module = [
  "tests.security.test_sanitization_properties",
  "tests.security.test_path_validator_properties",
]
disallow_untyped_decorators = false
