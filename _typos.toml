# typos (added to the lintro tool set in 0.171.x) false positives.
[default.extend-identifiers]
# Pillow image mode names are case-sensitive identifiers.
La = "La"
RGBa = "RGBa"

[default.extend-words]
# "mis-reads" is intentional hyphenation, not a misspelling of "miss".
mis = "mis"
# Accepted spelling variant used in error messages and docstrings.
unparseable = "unparseable"
# Python package name (dependency); appears in changelog and lock entries.
certifi = "certifi"
