# typos (added to the lintro tool set in 0.171.x) false positives.
[default.extend-identifiers]
# Pillow image mode names are case-sensitive identifiers.
La = "La"
RGBa = "RGBa"
# Commit hash of #479, which the release workflow writes in CHANGELOG.md.
# typos reads the "ded" inside it as a word.
88ded29 = "88ded29"

[default.extend-words]
# "mis-reads" is intentional hyphenation, not a misspelling of "miss".
mis = "mis"
# Accepted spelling variant used in error messages and docstrings.
unparseable = "unparseable"
# Python package name (dependency); appears in changelog and lock entries.
certifi = "certifi"
# Core Audio Format: the container's short name and ffmpeg's muxer name.
caf = "caf"
# The track box of ISO-BMFF and QuickTime files, matched by its four-byte name.
trak = "trak"
