---
name: Security - OpenSSF Scorecard Analysis

'on':
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecards:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-scorecards.yml@d1a4cbe278d60e631d95800f449d25e174140ea1 # v0.77.4
    with:
      egress-policy: block
      # Full list: allowed-endpoints is fed verbatim to harden-runner (no
      # preset resolution in the scorecard job); no lgtm-ci composites run
      # here so scorecard-action publish verification passes (lgtm-ci #535).
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        pipelines.actions.githubusercontent.com:443
        gcr.io:443
        api.osv.dev:443
        api.deps.dev:443
        api.scorecard.dev:443
        api.securityscorecards.dev:443
        agent.api.stepsecurity.io:443
        fulcio.sigstore.dev:443
        rekor.sigstore.dev:443
        sigstore.dev:443
        tuf-repo-cdn.sigstore.dev:443
        release-assets.githubusercontent.com:443
        oss-fuzz-build-logs.storage.googleapis.com:443
        ossf.github.io:443
        www.bestpractices.dev:443
    permissions:
      # read: checkout repository for OpenSSF Scorecard analysis
      contents: read
      # write: upload scorecard results to the Security tab
      security-events: write
      # write: OIDC authentication for scorecard attestation
      id-token: write
