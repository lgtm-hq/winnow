---
name: Security - OpenSSF Scorecard Analysis

'on':
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecards-${{ github.ref }}
  # Queue, never cancel, on main: a manual run must not cancel an in-flight
  # scheduled scan, which notify-failure would report as a failure (#356).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  scorecards:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-scorecards.yml@d9e2ca3a4a7646bf7b4a810567db65a781267ce6 # v0.116.5
    with:
      egress-policy: block
      # The scorecard preset plus the hosts below: the same 20 hosts as the
      # old hand-written list (#465). At lgtm-ci v0.116.3 the reusable
      # composes the list in a separate job in either mode, so the scorecard
      # job runs the same steps as before (lgtm-ci #535, #1173).
      # "Called" means by scorecard-action in scheduled run 45224542146.
      # - api.deps.dev: dependency data for the checks (called).
      # - agent.api.stepsecurity.io: kept from the old list, harden-runner's
      #   own API.
      # - fulcio.sigstore.dev: signing the published results (called).
      # - rekor.sigstore.dev: transparency log for that signature (called).
      # - sigstore.dev: kept from the old list (not called).
      # - tuf-repo-cdn.sigstore.dev: Sigstore trust root (called).
      # - release-assets.githubusercontent.com: kept from the old list,
      #   GitHub release downloads (not called).
      # - oss-fuzz-build-logs.storage.googleapis.com: Fuzzing check (called).
      # - ossf.github.io: kept from the old list (not called).
      # - www.bestpractices.dev: CII-Best-Practices check (called).
      egress-preset: scorecard
      allowed-endpoints-mode: append
      allowed-endpoints: >
        api.deps.dev:443
        agent.api.stepsecurity.io:443
        fulcio.sigstore.dev:443
        rekor.sigstore.dev:443
        sigstore.dev:443
        tuf-repo-cdn.sigstore.dev:443
        release-assets.githubusercontent.com:443
        oss-fuzz-build-logs.storage.googleapis.com:443
        ossf.github.io:443
        www.bestpractices.dev:443
    permissions:
      # read: the nested SARIF-uploading job requests actions: read
      # (upload-sarif looks up the workflow run via the Actions API;
      # lgtm-ci#1310). A caller must grant every scope a nested job asks for.
      actions: read
      # read: checkout repository for OpenSSF Scorecard analysis
      contents: read
      # write: upload scorecard results to the Security tab
      security-events: write
      # write: OIDC authentication for scorecard attestation
      id-token: write

  # Durable failure report for main pushes and scheduled runs (#356): the
  # first failed, cancelled or timed-out run opens one issue per workflow key,
  # later ones comment on it. Needs every job above. Pull requests, merge
  # queues, tags and manual runs never report here. Why the condition reads
  # needs.*.result: see the notify-failure job in test-ci.yml.
  notify-failure:
    needs: [scorecards]
    if: >-
      always()
      && (contains(needs.*.result, 'failure')
      || contains(needs.*.result, 'cancelled'))
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'schedule')
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-main-failure-notifier.yml@d9e2ca3a4a7646bf7b4a810567db65a781267ce6 # v0.116.5
    permissions:
      # read: list the run's jobs and steps for the issue body
      actions: read
      # read: repository context for the issue body
      contents: read
      # write: open or comment on the deduplicated failure issue
      issues: write
    with:
      workflow-key: scorecards
      egress-policy: block
