---
name: Security - OpenSSF Scorecard Analysis

'on':
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecards:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-scorecards.yml@d990149fa4189262a41abc706c35271c098b2807 # v0.99.0
    with:
      egress-policy: block
      # Full list: allowed-endpoints is fed verbatim to harden-runner (no
      # preset resolution in the scorecard job); no lgtm-ci composites run
      # here so scorecard-action publish verification passes (lgtm-ci #535).
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        pipelines.actions.githubusercontent.com:443
        gcr.io:443
        api.osv.dev:443
        api.deps.dev:443
        api.scorecard.dev:443
        api.securityscorecards.dev:443
        agent.api.stepsecurity.io:443
        fulcio.sigstore.dev:443
        rekor.sigstore.dev:443
        sigstore.dev:443
        tuf-repo-cdn.sigstore.dev:443
        release-assets.githubusercontent.com:443
        oss-fuzz-build-logs.storage.googleapis.com:443
        ossf.github.io:443
        www.bestpractices.dev:443
    permissions:
      # read: the nested SARIF-uploading job requests actions: read
      # (upload-sarif looks up the workflow run via the Actions API;
      # lgtm-ci#1310). A caller must grant every scope a nested job asks for.
      actions: read
      # read: checkout repository for OpenSSF Scorecard analysis
      contents: read
      # write: upload scorecard results to the Security tab
      security-events: write
      # write: OIDC authentication for scorecard attestation
      id-token: write

  # Durable failure report for main pushes and scheduled runs (#356): the
  # first failed or cancelled run opens one issue per workflow key, later ones
  # comment on it. Needs every job above, so a failure anywhere is reported;
  # an intended skip is neither a failure nor a cancellation and stays quiet.
  # Pull requests, merge queues, tags and manual runs never report here.
  notify-failure:
    needs: [scorecards]
    if: >-
      (failure() || cancelled())
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'schedule')
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-main-failure-notifier.yml@d990149fa4189262a41abc706c35271c098b2807 # v0.99.0
    permissions:
      # read: list the run's jobs and steps for the issue body
      actions: read
      # read: repository context for the issue body
      contents: read
      # write: open or comment on the deduplicated failure issue
      issues: write
    with:
      workflow-key: scorecards
      egress-policy: block
