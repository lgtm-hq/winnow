# SPDX-License-Identifier: MIT
---
name: Quality Check - Lintro Version Sync

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # No paths filter: `validate / 🧾 Validate Lintro Version` is a required
    # status check, and a path-filtered workflow that does not run leaves
    # that context absent (not skipped), which permanently blocks PRs and
    # merge-queue entries that touch only non-matching files
    # (workflow-contract § Required-check-safe conditional workflows;
    # deadlocked config-only PR #115). The check is produced by a
    # reusable-workflow caller job, so the detect-changes step-gating
    # pattern cannot apply across the workflow_call boundary — the
    # validation is cheap (~1 min), so always run on PRs.
  merge_group:
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - '.github/workflows/quality-ci.yml'
      - '.github/workflows/validate-lintro-version.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-lintro-version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate-lintro-version.yml@f8f58587e4c324f6f0c9b3b4f59cfc93aa7d5d0f # v0.69.6
    with:
      tooling-ref: 'f8f58587e4c324f6f0c9b3b4f59cfc93aa7d5d0f' # v0.69.6
      # Org ruleset (checks-winnow): validate / 🧾 Validate Lintro Version
      job-name: '🧾 Validate Lintro Version'
      # Caller repos must pass lintro-image; resolve-lintro-image.sh defaults to
      # lgtm-ci-owned paths that do not exist in consumer repositories.
      # yamllint disable-line rule:line-length
      lintro-image: ghcr.io/lgtm-hq/py-lintro@sha256:95b9fd9d62c3ca1227447467767ec915e78a7eef62282dd18c0b1c02ee4d3887
      egress-policy: block
      egress-preset: quality
    permissions:
      # read: read pyproject.toml and workflow files for version sync checks
      contents: read
      # read: resolve lintro package metadata from GHCR
      packages: read
