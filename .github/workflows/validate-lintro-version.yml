# SPDX-License-Identifier: MIT
---
name: Quality Check - Lintro Version Sync

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'pyproject.toml'
      - '.github/workflows/quality-ci.yml'
      - '.github/workflows/validate-lintro-version.yml'
  merge_group:
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - '.github/workflows/quality-ci.yml'
      - '.github/workflows/validate-lintro-version.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-lintro-version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate-lintro-version.yml@cecca744299be6a34f3b4ea4f18c00262081ab61 # v0.41.0
    with:
      tooling-ref: 'cecca744299be6a34f3b4ea4f18c00262081ab61' # v0.41.0
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      # read: read pyproject.toml and workflow files for version sync checks
      contents: read
      # read: resolve lintro package metadata from GHCR
      packages: read
