---
name: Security - CodeQL Code Scanning

'on':
  push:
    branches: [main]
    paths: ['**.py', 'pyproject.toml', '.github/**']
  pull_request:
    branches: [main]
    # No paths filter: `codeql / 🔬 CodeQL Analysis` is a required status
    # check, and a path-filtered workflow that does not run leaves that
    # context absent (not skipped), which permanently blocks PRs and
    # merge-queue entries that touch only non-matching files
    # (workflow-contract § Required-check-safe conditional workflows;
    # deadlocked config-only PR #115). The check is produced by a
    # reusable-workflow caller job, so the detect-changes step-gating
    # pattern cannot apply across the workflow_call boundary — always run
    # on PRs instead (py-lintro is the reference consumer).
  merge_group:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  codeql:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-codeql.yml@d9e2ca3a4a7646bf7b4a810567db65a781267ce6 # v0.116.5
    with:
      # Org ruleset (checks-winnow): codeql / 🔬 CodeQL Analysis
      job-name: '🔬 CodeQL Analysis'
      languages: python
      build-mode: none
      config-file: .github/codeql/codeql-config.yml
      category: '/language:all'
      tooling-ref: 'd9e2ca3a4a7646bf7b4a810567db65a781267ce6' # v0.116.5
      egress-policy: block
      # The preset alone: at lgtm-ci v0.116.3 github-tooling holds exactly
      # the eight hosts of the old hand-written list, including
      # release-assets.githubusercontent.com, where CodeQL bundle downloads
      # redirect (#465).
      egress-preset: github-tooling
    permissions:
      # read: the nested SARIF-uploading job requests actions: read
      # (upload-sarif looks up the workflow run via the Actions API;
      # lgtm-ci#1310). A caller must grant every scope a nested job asks for.
      actions: read
      # read: checkout repository for CodeQL analysis
      contents: read
      # write: upload CodeQL findings to the Security tab
      security-events: write

  # Durable failure report for main pushes and scheduled runs (#356): the
  # first failed, cancelled or timed-out run opens one issue per workflow key,
  # later ones comment on it. Needs every job above. Pull requests, merge
  # queues, tags and manual runs never report here. Why the condition reads
  # needs.*.result: see the notify-failure job in test-ci.yml.
  notify-failure:
    needs: [codeql]
    if: >-
      always()
      && (contains(needs.*.result, 'failure')
      || contains(needs.*.result, 'cancelled'))
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'schedule')
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-main-failure-notifier.yml@d9e2ca3a4a7646bf7b4a810567db65a781267ce6 # v0.116.5
    permissions:
      # read: list the run's jobs and steps for the issue body
      actions: read
      # read: repository context for the issue body
      contents: read
      # write: open or comment on the deduplicated failure issue
      issues: write
    with:
      workflow-key: codeql
      egress-policy: block
