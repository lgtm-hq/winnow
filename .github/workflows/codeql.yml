---
name: Security - CodeQL Code Scanning

'on':
  push:
    branches: [main]
    paths: ['**.py', 'pyproject.toml', '.github/**']
  pull_request:
    branches: [main]
    # No paths filter: `codeql / CodeQL` is a required status check, and a
    # path-filtered workflow that does not run leaves that context absent
    # (not skipped), which permanently blocks PRs and merge-queue entries
    # that touch only non-matching files (workflow-contract § Required-check-
    # safe conditional workflows; deadlocked config-only PR #115). The check
    # is produced by a reusable-workflow caller job, so the detect-changes
    # step-gating pattern cannot apply across the workflow_call boundary —
    # always run on PRs instead (py-lintro is the reference consumer).
  merge_group:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  codeql:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-codeql.yml@66cad82ead0e5d119928c895c7d7da9c837989e5 # v0.52.3
    with:
      languages: python
      build-mode: none
      config-file: .github/codeql/codeql-config.yml
      category: '/language:all'
      tooling-ref: '66cad82ead0e5d119928c895c7d7da9c837989e5' # v0.52.3
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      # read: checkout repository for CodeQL analysis
      contents: read
      # write: upload CodeQL findings to the Security tab
      security-events: write
