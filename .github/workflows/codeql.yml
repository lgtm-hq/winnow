---
name: Security - CodeQL Code Scanning

'on':
  push:
    branches: [main]
    paths: ['**.py', 'pyproject.toml', '.github/**']
  pull_request:
    branches: [main]
    # No paths filter: `codeql / 🔬 CodeQL Analysis` is a required status
    # check, and a path-filtered workflow that does not run leaves that
    # context absent (not skipped), which permanently blocks PRs and
    # merge-queue entries that touch only non-matching files
    # (workflow-contract § Required-check-safe conditional workflows;
    # deadlocked config-only PR #115). The check is produced by a
    # reusable-workflow caller job, so the detect-changes step-gating
    # pattern cannot apply across the workflow_call boundary — always run
    # on PRs instead (py-lintro is the reference consumer).
  merge_group:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  codeql:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-codeql.yml@66cad82ead0e5d119928c895c7d7da9c837989e5 # v0.52.3
    with:
      # Org ruleset (checks-winnow): codeql / 🔬 CodeQL Analysis
      job-name: '🔬 CodeQL Analysis'
      languages: python
      build-mode: none
      config-file: .github/codeql/codeql-config.yml
      category: '/language:all'
      tooling-ref: '66cad82ead0e5d119928c895c7d7da9c837989e5' # v0.52.3
      egress-policy: block
      egress-preset: github-tooling
      # CodeQL bundle downloads redirect to
      # release-assets.githubusercontent.com, which the github-tooling preset
      # lacks. On pull_request the action prefers the runner toolcache and
      # rarely downloads, but merge_group/push runs pull the linked default
      # CLI version and hard-fail on the egress block when it misses the
      # toolcache (e.g. v2.26.0 rollout, 2026-07-11). The reusable's setup
      # job hardens with this raw input before the allowlist resolver is
      # checked out, so the full endpoint list must be passed (the reusable
      # input default plus the release-assets host) rather than an
      # append-mode single host.
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        uploads.github.com:443
        pipelines.actions.githubusercontent.com:443
        release-assets.githubusercontent.com:443
    permissions:
      # read: checkout repository for CodeQL analysis
      contents: read
      # write: upload CodeQL findings to the Security tab
      security-events: write
