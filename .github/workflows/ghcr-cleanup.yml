---
name: Maintenance - GHCR Registry Cleanup
# Weekly cleanup of untagged container images from GitHub Container Registry.
# Tagged release images are preserved by the lgtm-ci reusable workflow.
#
# IMPORTANT: Multi-arch images have architecture-specific manifests that appear
# as "untagged" but are referenced by the main manifest index. The lgtm-ci
# reusable collects referenced digests and skips prune when collection fails.

'on':
  schedule:
    # Run weekly on Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log only, no deletions)'
        required: false
        # Default manual runs to non-destructive; opt in to real deletions.
        default: true
        type: boolean
      min_age_days:
        description: 'Minimum age in days before deletion'
        required: false
        default: 7
        type: number

concurrency:
  group: ghcr-cleanup
  cancel-in-progress: false

permissions: {}

jobs:
  # Gate cleanup on package existence: lgtm-ci reusable fails hard when the
  # GHCR package is absent, so check first to keep scheduled runs safe.
  check-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # checkout for the package existence script
      packages: read # query GHCR package metadata via Packages API
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
      - name: Checkout repository
        # yamllint disable-line rule:line-length
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Check GHCR package exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: winnow
        run: ./scripts/ci/maintenance/check-ghcr-package.sh

  prune-untagged:
    needs: [check-package]
    if: needs.check-package.outputs.exists == 'true'
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-ghcr-cleanup.yml@f8f58587e4c324f6f0c9b3b4f59cfc93aa7d5d0f # v0.69.6
    permissions:
      contents: read # checkout repo and lgtm-ci tooling sparse checkout
      packages: write # delete untagged GHCR package versions via Packages API
    with:
      package-name: winnow
      min-age-days: >-
        ${{ github.event_name != 'workflow_dispatch' && 7 || inputs.min_age_days }}
      dry-run: ${{ inputs.dry_run == true }}
      tooling-ref: 'f8f58587e4c324f6f0c9b3b4f59cfc93aa7d5d0f' # v0.69.6
      egress-policy: block
      # Pair this workflow with the reusable's github-tooling baseline. In
      # replace mode, egress-preset is documentation/pairing only: the
      # explicit allowed-endpoints list below is the harden-runner allowlist,
      # so keep every github-tooling baseline endpoint listed here.
      egress-preset: github-tooling
      allowed-endpoints-mode: replace
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        uploads.github.com:443
        pipelines.actions.githubusercontent.com:443
        ghcr.io:443
        pkg-containers.githubusercontent.com:443
      runner-image: ubuntu-24.04
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
