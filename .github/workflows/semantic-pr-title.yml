---
name: PR - Title Validation

'on':
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:

permissions: {}

concurrency:
  group: semantic-pr-title-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semantic-title:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-semantic-pr-title.yml@f8f58587e4c324f6f0c9b3b4f59cfc93aa7d5d0f # v0.69.6
    with:
      tooling-ref: 'f8f58587e4c324f6f0c9b3b4f59cfc93aa7d5d0f' # v0.69.6
      # Org ruleset (checks-winnow): semantic-title / 📝 Validate PR Title
      job-name: '📝 Validate PR Title'
      egress-policy: block
      egress-preset: github-minimal
    permissions:
      contents: read
      # write: post/clear marker-based failure comments (post-failure-comment default)
      pull-requests: write
