---
name: PR - Auto Label

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@710c7ba40bf7b48b4d7c3442e3b60fb4b542db91 # v0.77.5
    with:
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: '710c7ba40bf7b48b4d7c3442e3b60fb4b542db91' # v0.77.5
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
