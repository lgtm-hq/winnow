---
name: PR - Auto Label

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@43325346d688be984d6bde155603d18fbdd89278 # v0.33.0
    with:
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: '43325346d688be984d6bde155603d18fbdd89278' # v0.33.0
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
