---
name: PR - Auto Label

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@d9e2ca3a4a7646bf7b4a810567db65a781267ce6 # v0.116.5
    with:
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: 'd9e2ca3a4a7646bf7b4a810567db65a781267ce6' # v0.116.5
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
