---
name: PR - Auto Label

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@d990149fa4189262a41abc706c35271c098b2807 # v0.99.0
    with:
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: 'd990149fa4189262a41abc706c35271c098b2807' # v0.99.0
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
