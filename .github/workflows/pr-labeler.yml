---
name: PR - Auto Label

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@cecca744299be6a34f3b4ea4f18c00262081ab61 # v0.41.0
    with:
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: 'cecca744299be6a34f3b4ea4f18c00262081ab61' # v0.41.0
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
