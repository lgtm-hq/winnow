---
name: Security - Dependency Review

'on':
  pull_request:
    branches: [main]
  merge_group:

permissions: {}

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-dependency-review.yml@d1a4cbe278d60e631d95800f449d25e174140ea1 # v0.77.4
    with:
      fail-on-severity: high
      tooling-ref: 'd1a4cbe278d60e631d95800f449d25e174140ea1' # v0.77.4
      egress-policy: block
      # Full allowlist (scorecard preset + project extras): at v0.69.6
      # harden-runner enforces the caller's allowed-endpoints literally
      # (its pre hook cannot see resolved preset output), so partial
      # append lists would block checkout.
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        pipelines.actions.githubusercontent.com:443
        gcr.io:443
        api.osv.dev:443
        api.scorecard.dev:443
        api.securityscorecards.dev:443
        api.deps.dev:443
        release-assets.githubusercontent.com:443
    permissions:
      # read: fetch manifest lockfiles for dependency comparison
      contents: read
      # read: read PR metadata for dependency-review-action
      pull-requests: read
