---
name: Security - Dependency Review

'on':
  pull_request:
    branches: [main]
  merge_group:

permissions: {}

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-dependency-review.yml@cecca744299be6a34f3b4ea4f18c00262081ab61 # v0.41.0
    with:
      fail-on-severity: high
      tooling-ref: 'cecca744299be6a34f3b4ea4f18c00262081ab61' # v0.41.0
      egress-policy: block
      egress-preset: scorecard
    permissions:
      # read: fetch manifest lockfiles for dependency comparison
      contents: read
      # read: read PR metadata for dependency-review-action
      pull-requests: read
