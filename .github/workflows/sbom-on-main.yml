---
name: Security - SBOM Generation

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: sbom-main-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  sbom:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-sbom.yml@43325346d688be984d6bde155603d18fbdd89278 # v0.33.0
    with:
      target: .
      target-type: dir
      sbom-format: cyclonedx-json
      scan-vulnerabilities: true
      create-attestation: true
      tooling-ref: '43325346d688be984d6bde155603d18fbdd89278' # v0.33.0
      egress-policy: block
      egress-preset: sbom
    permissions:
      # read: checkout repository for SBOM generation
      contents: read
      # write: upload vulnerability findings to the Security tab
      security-events: write
      # write: OIDC token for SBOM attestation signing
      id-token: write
      # write: publish SBOM attestations
      attestations: write
