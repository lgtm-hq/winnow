---
name: Maintenance - Auto Rerun on Infra Failure

# When a listed workflow's run fails and its failed-job logs match a known
# transient infrastructure signature, re-run that run's failed jobs once
# (#356). The lgtm-ci reusable decides: it reads the failed-job logs and
# check-run annotations, re-runs only on a matched signature, never on attempt
# 2 or later (max-reruns 1), and never when a failed job is named like
# publish, promote, release or upload. Assertion failures, CVEs and egress
# refusals match no signature and stay red for a human.
#
# workflow_run always uses this file as it is on main, with a token of this
# repository, so changes take effect only after merging. Nothing here checks
# out or runs code from the triggering run.
#
# Watched: the producers that run on pull requests, merge queues, main pushes
# and schedules and only read or build (tests, lint, Docker build, security
# scans, PR validators). Not watched:
#   - Publish - PyPI Production: the tag release pipeline; its retry and
#     reporting belong to #271.
#   - Release - Auto Tag, Release - Version PR: they push tags and open
#     release PRs, so a partial run must not be repeated automatically.
#   - Maintenance - GHCR Registry Cleanup: it deletes registry versions;
#     the next weekly run retries anyway.
#   - PR - All Checks Gate: no gate rerun loop; retry-aware gate refresh
#     belongs to #352.
#   - AI Review, PR - File Breakdown, PR - Auto Assign, PR - Auto Label:
#     they write comments, labels or assignees on pull requests.
# Every name below must match a workflow's `name:` exactly
# (tests/test_auto_rerun_on_infra_failure_workflow.py checks it).

'on':
  workflow_run:
    workflows:
      - Build - Docker Image & Registry
      - CI - Tests
      - Quality - Lint & Format
      - Quality Check - Action Pinning Validation
      - Quality Check - Lintro Version Sync
      - PR - Title Validation
      - Security - CodeQL Code Scanning
      - Security - Dependency Review
      - Security - OSV Audit
      - Security - OpenSSF Scorecard Analysis
      - Security - SBOM Generation
    types: [completed]

permissions: {}

jobs:
  rerun:
    # Only failed runs (not cancelled, not startup failures) whose head is
    # this repository: a fork pull request's run never reaches the
    # actions: write token, because the reusable has no fork check of its
    # own. Pull request and merge-queue runs, schedules and main pushes are
    # eligible; a push of a tag (the Docker release image) and manual runs
    # are not.
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && (github.event.workflow_run.event == 'pull_request'
      || github.event.workflow_run.event == 'merge_group'
      || github.event.workflow_run.event == 'schedule'
      || (github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'))
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-auto-rerun-on-infra-failure.yml@d9e2ca3a4a7646bf7b4a810567db65a781267ce6 # v0.116.5
    permissions:
      # write: read failed-job logs and re-run the failed jobs
      actions: write
      # read: check-run annotations, where a job that never got a runner
      # reports "failed to be acquired"; GitHub refuses to start the run
      # without it because the reusable's job requests it
      checks: read
      # read: repository context for the lgtm-ci tooling checkout
      contents: read
    with:
      # The payload carries numbers; the reusable's inputs are strings.
      run-id: ${{ format('{0}', github.event.workflow_run.id) }}
      run-attempt: ${{ format('{0}', github.event.workflow_run.run_attempt) }}
      # One automatic re-run per run, whatever the siblings chose (#356):
      # attempt 1 may be re-run, attempt 2 is left for a human.
      max-reruns: '1'
      # Appended to lgtm-ci's built-in signatures (runner shutdown, lost
      # communication, action download info, cosign OIDC). A fixed string:
      # the ::error:: line lgtm-ci's Docker readiness wait prints when
      # `docker info` hangs after harden-runner starts, which lgtm-ci itself
      # classifies as infrastructure (infra_canary_signatures). Seen in Docker
      # run 43917277896 attempt 1, which passed when re-run by hand.
      signatures: |-
        Docker info timed out after harden-runner initialized
      egress-policy: block
      # github-results: GitHub's API plus the results storage hosts that
      # job-log downloads redirect to.
      egress-preset: github-results
