---
name: Build - Docker Image & Registry
# Builds and publishes Docker images to GHCR via lgtm-ci reusable-docker.
# PR: validate-only build (no push). main/tag: push, scan, provenance, SBOM.

'on':
  push:
    branches: [main]
    tags:
      - '*.*.*'
      - v*.*.*
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  docker:
    name: 🐳 Docker Image
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-docker.yml@d9e2ca3a4a7646bf7b4a810567db65a781267ce6 # v0.116.5
    permissions:
      # read: the nested SARIF-uploading job requests actions: read
      # (upload-sarif looks up the workflow run via the Actions API;
      # lgtm-ci#1310). A caller must grant every scope a nested job asks for.
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    with:
      image-name: lgtm-hq/winnow
      version: >-
        ${{ startsWith(github.ref, 'refs/tags/')
        && github.ref_name || '' }}
      push: >-
        ${{ github.event_name != 'pull_request'
        && (github.ref == 'refs/heads/main'
        || startsWith(github.ref, 'refs/tags/')) }}
      tag-latest: true
      platforms: linux/amd64,linux/arm64
      runner-map: '{"linux/arm64":"ubuntu-24.04-arm"}'
      smoke-test: --version
      validate-on-pr: true
      scan: true
      # Advisory-only: debian slim base images routinely carry OS CVEs that
      # are not actionable for this CLI image. Failures would block every
      # publish; SARIF still uploads for visibility.
      scan-exit-code: '0'
      cache-registry-ref: ghcr.io/lgtm-hq/winnow:cache
      provenance: true
      sbom: true
      cosign-sign: true
      tooling-ref: 'd9e2ca3a4a7646bf7b4a810567db65a781267ce6' # v0.116.5
      egress-policy: block
      # The docker preset plus the hosts below: the same 29 hosts as the old
      # hand-written list (#465).
      # - pypi.org: uv sync in the image build (called by uv in tag run
      #   45228316468).
      # - files.pythonhosted.org: wheel downloads for that uv sync (same run).
      # - oauth2.sigstore.dev: kept from the old list for keyless cosign-sign
      #   (not called in runs 45247360714 or 45228316468).
      # - get.trivy.dev: kept from the old list, Trivy's installer host (not
      #   called in those runs).
      # - public.ecr.aws: kept from the old list, a Trivy database mirror (not
      #   called in those runs; the preset has mirror.gcr.io).
      egress-preset: docker
      allowed-endpoints-mode: append
      allowed-endpoints: >
        pypi.org:443
        files.pythonhosted.org:443
        oauth2.sigstore.dev:443
        get.trivy.dev:443
        public.ecr.aws:443

  # Durable failure report for main pushes and scheduled runs (#356): the
  # first failed, cancelled or timed-out run opens one issue per workflow key,
  # later ones comment on it. Needs every job above. Pull requests, merge
  # queues, tags and manual runs never report here. Why the condition reads
  # needs.*.result: see the notify-failure job in test-ci.yml.
  notify-failure:
    needs: [docker]
    if: >-
      always()
      && (contains(needs.*.result, 'failure')
      || contains(needs.*.result, 'cancelled'))
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'schedule')
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-main-failure-notifier.yml@d9e2ca3a4a7646bf7b4a810567db65a781267ce6 # v0.116.5
    permissions:
      # read: list the run's jobs and steps for the issue body
      actions: read
      # read: repository context for the issue body
      contents: read
      # write: open or comment on the deduplicated failure issue
      issues: write
    with:
      workflow-key: docker-build-publish
      egress-policy: block
