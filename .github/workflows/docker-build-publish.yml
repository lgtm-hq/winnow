---
name: Build - Docker Image & Registry
# Builds and publishes Docker images to GHCR via lgtm-ci reusable-docker.
# PR: validate-only build (no push). main/tag: push, scan, provenance, SBOM.

'on':
  push:
    branches: [main]
    tags:
      - '*.*.*'
      - v*.*.*
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  docker:
    name: 🐳 Docker Image
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-docker.yml@d990149fa4189262a41abc706c35271c098b2807 # v0.99.0
    permissions:
      # read: the nested SARIF-uploading job requests actions: read
      # (upload-sarif looks up the workflow run via the Actions API;
      # lgtm-ci#1310). A caller must grant every scope a nested job asks for.
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    with:
      image-name: lgtm-hq/winnow
      version: >-
        ${{ startsWith(github.ref, 'refs/tags/')
        && github.ref_name || '' }}
      push: >-
        ${{ github.event_name != 'pull_request'
        && (github.ref == 'refs/heads/main'
        || startsWith(github.ref, 'refs/tags/')) }}
      tag-latest: true
      platforms: linux/amd64,linux/arm64
      runner-map: '{"linux/arm64":"ubuntu-24.04-arm"}'
      smoke-test: --version
      validate-on-pr: true
      scan: true
      # Advisory-only: debian slim base images routinely carry OS CVEs that
      # are not actionable for this CLI image. Failures would block every
      # publish; SARIF still uploads for visibility.
      scan-exit-code: '0'
      cache-registry-ref: ghcr.io/lgtm-hq/winnow:cache
      provenance: true
      sbom: true
      cosign-sign: true
      tooling-ref: 'd990149fa4189262a41abc706c35271c098b2807' # v0.99.0
      egress-policy: block
      egress-preset: docker
      allowed-endpoints-mode: replace
      # Full list (replace mode): docker preset baseline + pypi/astral for uv
      # build + sigstore for cosign + trivy hosts (get.trivy.dev installer;
      # ghcr.io/mirror.gcr.io/public.ecr.aws for vulnerability DB).
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        release-assets.githubusercontent.com:443
        github-releases.githubusercontent.com:443
        pipelines.actions.githubusercontent.com:443
        ghcr.io:443
        pkg-containers.githubusercontent.com:443
        docker.io:443
        registry-1.docker.io:443
        auth.docker.io:443
        production.cloudflare.docker.com:443
        production.cloudfront.docker.com:443
        pypi.org:443
        files.pythonhosted.org:443
        token.actions.githubusercontent.com:443
        fulcio.sigstore.dev:443
        rekor.sigstore.dev:443
        tuf-repo-cdn.sigstore.dev:443
        timestamp.sigstore.dev:443
        oauth2.sigstore.dev:443
        get.trivy.dev:443
        mirror.gcr.io:443
        public.ecr.aws:443

  # Durable failure report for main pushes and scheduled runs (#356): the
  # first failed or cancelled run opens one issue per workflow key, later ones
  # comment on it. Needs every job above, so a failure anywhere is reported;
  # an intended skip is neither a failure nor a cancellation and stays quiet.
  # Pull requests, merge queues, tags and manual runs never report here.
  notify-failure:
    needs: [docker]
    if: >-
      (failure() || cancelled())
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'schedule')
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-main-failure-notifier.yml@d990149fa4189262a41abc706c35271c098b2807 # v0.99.0
    permissions:
      # read: list the run's jobs and steps for the issue body
      actions: read
      # read: repository context for the issue body
      contents: read
      # write: open or comment on the deduplicated failure issue
      issues: write
    with:
      workflow-key: docker-build-publish
      egress-policy: block
