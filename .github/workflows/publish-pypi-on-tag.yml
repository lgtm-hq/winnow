---
name: Publish - PyPI Production
# Publishes package to PyPI when version tags are pushed.
# Lint gate: docker-ci on main/PR (no duplicate quality on tag).
# Layout: lgtm-ci docs/python-release-publish.md (requires lgtm-ci v0.45.0+)

'on':
  push:
    tags:
      - '*.*.*'
      - v*.*.*
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sbom:
    name: Generate and verify SBOM
    if: ${{ !startsWith(github.ref_name, 'actions-v') }}
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-sbom.yml@6a80f4a55e4080272b2d93b30cc292d618f5dd5a # v0.45.0
    with:
      target: .
      target-type: dir
      sbom-format: cyclonedx-json
      scan-vulnerabilities: true
      create-attestation: true
      tooling-ref: '6a80f4a55e4080272b2d93b30cc292d618f5dd5a' # v0.45.0
      egress-policy: block
      egress-preset: sbom
    permissions:
      # read: checkout repo for SBOM generation
      contents: read
      # write: upload vulnerability findings to GitHub Security tab
      security-events: write
      # write: OIDC for SBOM attestation signing
      id-token: write
      # write: publish SBOM / build attestations
      attestations: write

  pypi-build:
    name: Build Python distribution
    needs: [sbom]
    if: >-
      github.ref_type == 'tag' &&
      !startsWith(github.ref_name, 'actions-v')
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-build-python-dist.yml@6a80f4a55e4080272b2d93b30cc292d618f5dd5a # v0.45.0
    permissions:
      # read: checkout and build sdist/wheel (reusable-build-python-dist)
      contents: read
    with:
      python-version: '3.13'
      verify-tag-version: true
      ensure-tag-on-default-branch: true
      artifact-name: python-dist
      tooling-ref: '6a80f4a55e4080272b2d93b30cc292d618f5dd5a' # v0.45.0
      egress-policy: block
      egress-preset: pypi
      allowed-endpoints-mode: append
      allowed-endpoints: >
        astral.sh:443
        releases.astral.sh:443
        github-releases.githubusercontent.com:443

  pypi-smoke-test:
    name: Smoke test distribution
    needs: [pypi-build]
    if: >-
      github.ref_type == 'tag' &&
      !startsWith(github.ref_name, 'actions-v')
    runs-on: ubuntu-latest
    permissions:
      # read: download python-dist workflow artifact
      contents: read
    steps:
      - name: Harden runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          # lgtm-ci workflow-contract.md § PyPI build + smoke install
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            astral.sh:443
            releases.astral.sh:443
      - name: Prepare distribution
        id: prepare
        # yamllint disable-line rule:line-length
        uses: lgtm-hq/lgtm-ci/.github/actions/prepare-pypi-upload@6a80f4a55e4080272b2d93b30cc292d618f5dd5a # v0.45.0
        with:
          artifact-name: python-dist
          python-version: '3.13'
          tooling-ref: '6a80f4a55e4080272b2d93b30cc292d618f5dd5a' # v0.45.0
          validate: 'false'
      - name: Install and verify CLI
        env:
          EXPECTED_VERSION: ${{ needs.pypi-build.outputs.version }}
        run: |
          uv pip install --system "${{ steps.prepare.outputs.dist-path }}"/*.whl
          ACTUAL_VERSION="$(
            winnow --version \
              | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._-]+)?' \
              | head -1
          )"
          if [[ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "Expected winnow --version to report ${EXPECTED_VERSION}," \
              "got ${ACTUAL_VERSION}"
            exit 1
          fi

  pypi-upload:
    name: Upload to PyPI
    needs: [pypi-build, pypi-smoke-test]
    if: >-
      github.ref_type == 'tag' &&
      !startsWith(github.ref_name, 'actions-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # read: download python-dist workflow artifact
      contents: read
      # write: OIDC JWT for PyPI trusted publishing (this workflow file)
      id-token: write
      # write: Sigstore provenance attestation after upload (best-effort)
      attestations: write
    steps:
      - name: Harden runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          # lgtm-ci workflow-contract.md § PyPI upload (OIDC)
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            pypi.org:443
            upload.pypi.org:443
            files.pythonhosted.org:443
            astral.sh:443
            releases.astral.sh:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            oauth2.sigstore.dev:443
      - name: Prepare PyPI upload
        id: prepare
        # yamllint disable-line rule:line-length
        uses: lgtm-hq/lgtm-ci/.github/actions/prepare-pypi-upload@6a80f4a55e4080272b2d93b30cc292d618f5dd5a # v0.45.0
        with:
          artifact-name: python-dist
          python-version: '3.13'
          tooling-ref: '6a80f4a55e4080272b2d93b30cc292d618f5dd5a' # v0.45.0
      - name: Upload to PyPI
        # yamllint disable-line rule:line-length
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          repository-url: https://upload.pypi.org/legacy/
          packages-dir: ${{ steps.prepare.outputs.dist-path }}
      - name: Attest build provenance
        continue-on-error: true
        # yamllint disable-line rule:line-length
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: ${{ steps.prepare.outputs.dist-path }}/*

  github-release:
    name: Create GitHub Release
    needs: [pypi-upload]
    if: ${{ !startsWith(github.ref_name, 'actions-v') }}
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-github-release.yml@6a80f4a55e4080272b2d93b30cc292d618f5dd5a # v0.45.0
    permissions:
      # write: create GitHub Release and upload dist assets
      contents: write
    with:
      artifact-name: python-dist
      generate-release-notes: true
      tooling-ref: '6a80f4a55e4080272b2d93b30cc292d618f5dd5a' # v0.45.0
      egress-policy: block
      egress-preset: github-tooling

  homebrew-dispatch:
    name: Notify Homebrew Tap
    needs: [pypi-upload, github-release, pypi-build]
    if: >-
      github.ref_type == 'tag' &&
      !startsWith(github.ref_name, 'actions-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          # lgtm-ci docs/python-release-publish.md § Homebrew tap dispatch
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            actions.githubusercontent.com:443
      - name: Dispatch formula update
        # yamllint disable-line rule:line-length
        uses: lgtm-hq/lgtm-ci/.github/actions/trigger-homebrew-update@6a80f4a55e4080272b2d93b30cc292d618f5dd5a # v0.45.0
        with:
          formula: winnow
          version: ${{ needs.pypi-build.outputs.version }}
          pypi-package: winnow-media
          token: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
