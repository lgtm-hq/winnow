---
name: Publish - PyPI Production
# Publishes package to PyPI when version tags are pushed.
# Lint gate: docker-ci on main/PR (no duplicate quality on tag).
# Layout: lgtm-ci docs/python-release-publish.md (requires lgtm-ci v0.45.0+)

'on':
  push:
    tags:
      - '*.*.*'
      - v*.*.*
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sbom:
    name: Generate and verify SBOM
    if: ${{ !startsWith(github.ref_name, 'actions-v') }}
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-sbom.yml@9ea778eb4e6b876d60b7b3d7d0d0aee5182717bb # v0.78.0
    with:
      target: .
      target-type: dir
      sbom-format: cyclonedx-json
      scan-vulnerabilities: true
      create-attestation: true
      tooling-ref: '9ea778eb4e6b876d60b7b3d7d0d0aee5182717bb' # v0.78.0
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      egress-preset: sbom
    permissions:
      # read: checkout only. Verified against reusable-sbom @ v0.77.5
      # (710c7ba40bf7b48b4d7c3442e3b60fb4b542db91): no job in that file
      # requests contents:write (lgtm-ci #770 moved release-asset upload
      # to reusable-sbom-release-upload.yml).
      contents: read
      # write: upload vulnerability findings to GitHub Security tab
      security-events: write
      # write: OIDC for SBOM attestation signing
      id-token: write
      # write: publish SBOM / build attestations
      attestations: write

  pypi-build:
    name: Build Python distribution
    needs: [sbom]
    if: >-
      github.ref_type == 'tag' &&
      !startsWith(github.ref_name, 'actions-v')
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-build-python-dist.yml@9ea778eb4e6b876d60b7b3d7d0d0aee5182717bb # v0.78.0
    permissions:
      # read: checkout and build sdist/wheel (reusable-build-python-dist)
      contents: read
      # write: build-provenance attestation of dist/* (attest defaults to
      # true); reusable-build-python-dist @ v0.77.5 declares both scopes
      # statically, so they must be granted even with attest: false.
      id-token: write
      attestations: write
    with:
      python-version: '3.13'
      verify-tag-version: true
      ensure-tag-on-default-branch: true
      artifact-name: python-dist
      tooling-ref: '9ea778eb4e6b876d60b7b3d7d0d0aee5182717bb' # v0.78.0
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      # Full allowlist (python-dist preset + project extras): at v0.77.5
      # harden-runner enforces the caller's allowed-endpoints literally
      # (its pre hook cannot see resolved preset output), so partial
      # append lists would block checkout.
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        pipelines.actions.githubusercontent.com:443
        pypi.org:443
        files.pythonhosted.org:443
        test.pypi.org:443
        upload.pypi.org:443
        upload.test.pypi.org:443
        astral.sh:443
        releases.astral.sh:443
        github-releases.githubusercontent.com:443
        release-assets.githubusercontent.com:443
        fulcio.sigstore.dev:443
        rekor.sigstore.dev:443
        timestamp.sigstore.dev:443
        tuf-repo-cdn.sigstore.dev:443
        tuf-repo.github.com:443
        sigstore-tuf-root.storage.googleapis.com:443
        oauth2.sigstore.dev:443

  pypi-smoke-test:
    name: Smoke test distribution
    needs: [pypi-build]
    if: >-
      github.ref_type == 'tag' &&
      !startsWith(github.ref_name, 'actions-v')
    runs-on: ubuntu-latest
    permissions:
      # read: download python-dist workflow artifact
      contents: read
      # read: prepare-pypi-upload @ v0.77.5 verifies each dist file's build
      # attestation (require-attestation defaults to true)
      attestations: read
    steps:
      - name: Harden runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
          # lgtm-ci workflow-contract.md § PyPI build + smoke install
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            astral.sh:443
            releases.astral.sh:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare distribution
        id: prepare
        # yamllint disable-line rule:line-length
        uses: lgtm-hq/lgtm-ci/.github/actions/prepare-pypi-upload@9ea778eb4e6b876d60b7b3d7d0d0aee5182717bb # v0.78.0
        with:
          artifact-name: python-dist
          python-version: '3.13'
          tooling-ref: '9ea778eb4e6b876d60b7b3d7d0d0aee5182717bb' # v0.78.0
          validate: 'false'
      - name: Install and verify CLI
        env:
          DIST_PATH: ${{ steps.prepare.outputs.dist-path }}
          EXPECTED_VERSION: ${{ needs.pypi-build.outputs.version }}
        run: bash scripts/ci/release/smoke-test-distribution.sh

  pypi-upload:
    name: Upload to PyPI
    needs: [pypi-build, pypi-smoke-test]
    if: >-
      github.ref_type == 'tag' &&
      !startsWith(github.ref_name, 'actions-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # read: download python-dist workflow artifact
      contents: read
      # write: OIDC JWT for PyPI trusted publishing (this workflow file)
      id-token: write
      # write: Sigstore provenance attestation after upload (best-effort)
      attestations: write
    steps:
      - name: Harden runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
          # lgtm-ci workflow-contract.md § PyPI upload (OIDC)
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            pypi.org:443
            upload.pypi.org:443
            files.pythonhosted.org:443
            astral.sh:443
            releases.astral.sh:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
            oauth2.sigstore.dev:443
      - name: Prepare PyPI upload
        id: prepare
        # yamllint disable-line rule:line-length
        uses: lgtm-hq/lgtm-ci/.github/actions/prepare-pypi-upload@9ea778eb4e6b876d60b7b3d7d0d0aee5182717bb # v0.78.0
        with:
          artifact-name: python-dist
          python-version: '3.13'
          tooling-ref: '9ea778eb4e6b876d60b7b3d7d0d0aee5182717bb' # v0.78.0
      - name: Upload to PyPI
        # yamllint disable-line rule:line-length
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://upload.pypi.org/legacy/
          packages-dir: ${{ steps.prepare.outputs.dist-path }}
      - name: Attest build provenance
        continue-on-error: true
        # yamllint disable-line rule:line-length
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.prepare.outputs.dist-path }}/*

  github-release:
    name: Create GitHub Release
    needs: [pypi-upload]
    if: ${{ !startsWith(github.ref_name, 'actions-v') }}
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-github-release.yml@9ea778eb4e6b876d60b7b3d7d0d0aee5182717bb # v0.78.0
    permissions:
      # needed by the "Create GitHub Release" step (id: gh-release) in
      # reusable-github-release @ v0.77.5
      # (710c7ba40bf7b48b4d7c3442e3b60fb4b542db91): creates the GitHub Release
      # and uploads dist assets
      contents: write
    with:
      artifact-name: python-dist
      generate-release-notes: true
      tooling-ref: '9ea778eb4e6b876d60b7b3d7d0d0aee5182717bb' # v0.78.0
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      egress-preset: github-tooling

  homebrew-dispatch:
    name: Notify Homebrew Tap
    needs: [pypi-upload, github-release, pypi-build]
    if: >-
      github.ref_type == 'tag' &&
      !startsWith(github.ref_name, 'actions-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
          # lgtm-ci docs/python-release-publish.md § Homebrew tap dispatch
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            actions.githubusercontent.com:443
      - name: Dispatch formula update
        # yamllint disable-line rule:line-length
        uses: lgtm-hq/lgtm-ci/.github/actions/trigger-homebrew-update@9ea778eb4e6b876d60b7b3d7d0d0aee5182717bb # v0.78.0
        with:
          formula: winnow
          version: ${{ needs.pypi-build.outputs.version }}
          pypi-package: winnow-media
          token: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
