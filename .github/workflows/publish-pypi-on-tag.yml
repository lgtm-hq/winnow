---
name: Publish - PyPI Production
# Publishes package to PyPI when version tags are pushed.
# Lint gate: docker-ci on main/PR (no duplicate quality on tag).
# Layout: lgtm-ci docs/python-release-publish.md (requires lgtm-ci v0.45.0+)

'on':
  push:
    tags:
      - '*.*.*'
      - v*.*.*
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sbom:
    name: Generate and verify SBOM
    if: ${{ !startsWith(github.ref_name, 'actions-v') }}
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-sbom.yml@d9e2ca3a4a7646bf7b4a810567db65a781267ce6 # v0.116.5
    with:
      target: .
      target-type: dir
      sbom-format: cyclonedx-json
      scan-vulnerabilities: true
      create-attestation: true
      tooling-ref: 'd9e2ca3a4a7646bf7b4a810567db65a781267ce6' # v0.116.5
      egress-policy: block
      egress-preset: sbom
    permissions:
      # read: the nested SARIF-uploading job requests actions: read
      # (upload-sarif looks up the workflow run via the Actions API;
      # lgtm-ci#1310). A caller must grant every scope a nested job asks for.
      actions: read
      # read: checkout only. Verified against reusable-sbom @ v0.77.5
      # (710c7ba40bf7b48b4d7c3442e3b60fb4b542db91): no job in that file
      # requests contents:write (lgtm-ci #770 moved release-asset upload
      # to reusable-sbom-release-upload.yml).
      contents: read
      # write: upload vulnerability findings to GitHub Security tab
      security-events: write
      # write: OIDC for SBOM attestation signing
      id-token: write
      # write: publish SBOM / build attestations
      attestations: write

  pypi-build:
    name: Build Python distribution
    needs: [sbom]
    if: >-
      github.ref_type == 'tag' &&
      !startsWith(github.ref_name, 'actions-v')
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-build-python-dist.yml@d9e2ca3a4a7646bf7b4a810567db65a781267ce6 # v0.116.5
    permissions:
      # read: checkout and build sdist/wheel (reusable-build-python-dist)
      contents: read
      # write: build-provenance attestation of dist/* (attest defaults to
      # true); reusable-build-python-dist @ v0.77.5 declares both scopes
      # statically, so they must be granted even with attest: false.
      id-token: write
      attestations: write
    with:
      python-version: '3.13'
      verify-tag-version: true
      ensure-tag-on-default-branch: true
      artifact-name: python-dist
      tooling-ref: 'd9e2ca3a4a7646bf7b4a810567db65a781267ce6' # v0.116.5
      egress-policy: block
      # python-dist plus the hosts below: the old hand-written list minus
      # sigstore-tuf-root.storage.googleapis.com, which lgtm-ci v0.112.0
      # dropped and no tag build from v0.37.15 to v0.37.19 called (#465).
      # None of the three was called in those builds either; each is kept
      # from the old list as a fallback path:
      # - astral.sh: uv installer host (setup-uv uses releases.astral.sh).
      # - github-releases.githubusercontent.com: older GitHub release
      #   download host, a setup-uv fallback.
      # - tuf-repo.github.com: TUF root of GitHub's own Sigstore instance.
      egress-preset: python-dist
      allowed-endpoints-mode: append
      allowed-endpoints: >
        astral.sh:443
        github-releases.githubusercontent.com:443
        tuf-repo.github.com:443

  pypi-smoke-test:
    name: Smoke test distribution
    needs: [pypi-build]
    if: >-
      github.ref_type == 'tag' &&
      !startsWith(github.ref_name, 'actions-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # read: download python-dist workflow artifact
      contents: read
      # read: prepare-pypi-upload @ v0.77.5 verifies each dist file's build
      # attestation (require-attestation defaults to true)
      attestations: read
    steps:
      - name: Harden runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          # lgtm-ci workflow-contract.md § PyPI build + smoke install
          # productionresultssa<N>: GitHub's results storage, listed by exact
          # host from api.github.com/meta (.domains.actions) because a
          # blob.core.windows.net wildcard admits any Azure storage account
          # (lgtm-ci workflow-contract.md § PyPI upload, lgtm-ci#1495).
          # tmaproduction: GitHub's attestation store, where
          # `gh attestation verify` in prepare-pypi-upload downloads each
          # bundle (lgtm-ci scripts/ci/lib/egress/presets.sh).
          allowed-endpoints: >
