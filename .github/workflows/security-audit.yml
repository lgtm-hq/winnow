# SPDX-License-Identifier: MIT
---
name: Security - OSV Audit

'on':
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-audit:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-security-audit.yml@614c5ad1fc91d742baed959643bdd1f261a71210 # v0.79.1
    with:
      tooling-ref: '614c5ad1fc91d742baed959643bdd1f261a71210' # v0.79.1
      # Org ruleset (checks-winnow): security-audit / 🔐 Security Audit
      job-name: '🔐 Security Audit'
      # yamllint disable-line rule:line-length
      lintro-image: ghcr.io/lgtm-hq/py-lintro@sha256:116e60912a8c7a2002349ef096cfa93644314492751746aacdd5ef228c74306f
      runner-image: ubuntu-24.04
      upload-comment-artifact: ${{ github.event_name == 'pull_request' }}
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      egress-preset: quality
    permissions:
      # read: checkout lockfiles and manifests for OSV scanning
      contents: read
      # read: access package metadata used by the security audit tooling
      packages: read

  publish-security-audit-comment:
    needs: security-audit
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-publish-security-audit-comment.yml@614c5ad1fc91d742baed959643bdd1f261a71210 # v0.79.1
    with:
      tooling-ref: '614c5ad1fc91d742baed959643bdd1f261a71210' # v0.79.1
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      egress-preset: github-tooling
    permissions:
      # read: checkout repository for comment generation
      contents: read
      # write: post OSV audit summary on the PR
      pull-requests: write
