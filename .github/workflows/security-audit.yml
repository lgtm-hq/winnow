# SPDX-License-Identifier: MIT
---
name: Security - OSV Audit

'on':
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-audit:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-security-audit.yml@0c373f1252e0fe23a1e119df639b51d63b02b7d8 # v0.116.3
    with:
      tooling-ref: '0c373f1252e0fe23a1e119df639b51d63b02b7d8' # v0.116.3
      # Org ruleset (checks-winnow): security-audit / 🔐 Security Audit
      job-name: '🔐 Security Audit'
      # yamllint disable-line rule:line-length
      lintro-image: ghcr.io/lgtm-hq/py-lintro@sha256:20c7c6666d0a8ccd53c304958bdb070883d96bbdaf31ceba6436d0e6a49bb57b
      runner-image: ubuntu-26.04
      upload-comment-artifact: ${{ github.event_name == 'pull_request' }}
      egress-policy: block
      egress-preset: quality
    permissions:
      # read: checkout lockfiles and manifests for OSV scanning
      contents: read
      # read: access package metadata used by the security audit tooling
      packages: read

  publish-security-audit-comment:
    needs: security-audit
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-publish-security-audit-comment.yml@0c373f1252e0fe23a1e119df639b51d63b02b7d8 # v0.116.3
    with:
      # Keep up to three earlier runs under "Previous runs" (lgtm-ci #1346).
      comment-history: true
      comment-history-limit: 3
      tooling-ref: '0c373f1252e0fe23a1e119df639b51d63b02b7d8' # v0.116.3
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      # read: checkout repository for comment generation
      contents: read
      # write: post OSV audit summary on the PR
      pull-requests: write

  # Durable failure report for main pushes and scheduled runs (#356): the
  # first failed, cancelled or timed-out run opens one issue per workflow key,
  # later ones comment on it. Needs every job above. Pull requests, merge
  # queues, tags and manual runs never report here. Why the condition reads
  # needs.*.result: see the notify-failure job in test-ci.yml.
  notify-failure:
    needs: [security-audit, publish-security-audit-comment]
    if: >-
      always()
      && (contains(needs.*.result, 'failure')
      || contains(needs.*.result, 'cancelled'))
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'schedule')
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-main-failure-notifier.yml@0c373f1252e0fe23a1e119df639b51d63b02b7d8 # v0.116.3
    permissions:
      # read: list the run's jobs and steps for the issue body
      actions: read
      # read: repository context for the issue body
      contents: read
      # write: open or comment on the deduplicated failure issue
      issues: write
    with:
      workflow-key: security-audit
      egress-policy: block
