# SPDX-License-Identifier: MIT
---
name: Security - OSV Audit

'on':
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-audit:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-security-audit.yml@b777111fb3aaa6f09589fb029f0094a05dd76003 # v0.77.7
    with:
      tooling-ref: 'b777111fb3aaa6f09589fb029f0094a05dd76003' # v0.77.7
      # Org ruleset (checks-winnow): security-audit / 🔐 Security Audit
      job-name: '🔐 Security Audit'
      # yamllint disable-line rule:line-length
      lintro-image: ghcr.io/lgtm-hq/py-lintro@sha256:f7c3b4a5f9447ce12879c4b92f3ec7097aa480c925a44a04bc5358dfd70237ed
      runner-image: ubuntu-24.04
      upload-comment-artifact: ${{ github.event_name == 'pull_request' }}
      egress-policy: block
      egress-preset: quality
    permissions:
      # read: checkout lockfiles and manifests for OSV scanning
      contents: read
      # read: access package metadata used by the security audit tooling
      packages: read

  publish-security-audit-comment:
    needs: security-audit
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-publish-security-audit-comment.yml@b777111fb3aaa6f09589fb029f0094a05dd76003 # v0.77.7
    with:
      tooling-ref: 'b777111fb3aaa6f09589fb029f0094a05dd76003' # v0.77.7
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      # read: checkout repository for comment generation
      contents: read
      # write: post OSV audit summary on the PR
      pull-requests: write
