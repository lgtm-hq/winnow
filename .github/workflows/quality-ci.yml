# SPDX-License-Identifier: MIT
---
name: Quality - Lint & Format

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: quality-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@d990149fa4189262a41abc706c35271c098b2807 # v0.99.0
    permissions:
      # read: checkout repository for lintro analysis
      contents: read
      # read: pull py-lintro Docker image from GHCR
      packages: read
    with:
      tooling-ref: 'd990149fa4189262a41abc706c35271c098b2807' # v0.99.0
      # Org ruleset (checks-winnow): quality / 🛠️ Lintro Code Quality
      job-name: '🛠️ Lintro Code Quality'
      # yamllint disable-line rule:line-length
      lintro-image: ghcr.io/lgtm-hq/py-lintro@sha256:20c7c6666d0a8ccd53c304958bdb070883d96bbdaf31ceba6436d0e6a49bb57b
      egress-policy: block
      egress-preset: quality

  publish-quality-summary:
    needs: quality
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && (
        github.event.pull_request.draft == false
        || github.event.action == 'ready_for_review'
      )
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-publish-quality-summary.yml@d990149fa4189262a41abc706c35271c098b2807 # v0.99.0
    permissions:
      # read: checkout repository metadata
      contents: read
      # write: post quality summary comment on the PR
      pull-requests: write
    with:
      exit-code: ${{ needs.quality.outputs.exit-code }}
      # Keep up to three earlier runs under "Previous runs" (lgtm-ci #1346).
      comment-history: true
      comment-history-limit: 3
      tooling-ref: 'd990149fa4189262a41abc706c35271c098b2807' # v0.99.0
      egress-policy: block
      egress-preset: github-tooling

  # Durable failure report for main pushes and scheduled runs (#356): the
  # first failed, cancelled or timed-out run opens one issue per workflow key,
  # later ones comment on it. Needs every job above. Pull requests, merge
  # queues, tags and manual runs never report here. Why the condition reads
  # needs.*.result: see the notify-failure job in test-ci.yml.
  notify-failure:
    needs: [quality, publish-quality-summary]
    if: >-
      always()
      && (contains(needs.*.result, 'failure')
      || contains(needs.*.result, 'cancelled'))
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'schedule')
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-main-failure-notifier.yml@d990149fa4189262a41abc706c35271c098b2807 # v0.99.0
    permissions:
      # read: list the run's jobs and steps for the issue body
      actions: read
      # read: repository context for the issue body
      contents: read
      # write: open or comment on the deduplicated failure issue
      issues: write
    with:
      workflow-key: quality-ci
      egress-policy: block
