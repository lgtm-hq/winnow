# SPDX-License-Identifier: MIT
---
name: Quality - Lint & Format

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: quality-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@710c7ba40bf7b48b4d7c3442e3b60fb4b542db91 # v0.77.5
    permissions:
      # read: checkout repository for lintro analysis
      contents: read
      # read: pull py-lintro Docker image from GHCR
      packages: read
    with:
      tooling-ref: '710c7ba40bf7b48b4d7c3442e3b60fb4b542db91' # v0.77.5
      # Org ruleset (checks-winnow): quality / 🛠️ Lintro Code Quality
      job-name: '🛠️ Lintro Code Quality'
      # yamllint disable-line rule:line-length
      lintro-image: ghcr.io/lgtm-hq/py-lintro@sha256:f7c3b4a5f9447ce12879c4b92f3ec7097aa480c925a44a04bc5358dfd70237ed
      egress-policy: block
      egress-preset: quality

  publish-quality-summary:
    needs: quality
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && (
        github.event.pull_request.draft == false
        || github.event.action == 'ready_for_review'
      )
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-publish-quality-summary.yml@710c7ba40bf7b48b4d7c3442e3b60fb4b542db91 # v0.77.5
    permissions:
      # read: checkout repository metadata
      contents: read
      # write: post quality summary comment on the PR
      pull-requests: write
    with:
      exit-code: ${{ needs.quality.outputs.exit-code }}
      tooling-ref: '710c7ba40bf7b48b4d7c3442e3b60fb4b542db91' # v0.77.5
      egress-policy: block
      egress-preset: github-tooling
