---
name: PR - All Checks Gate
# One required check, `gate / ✅ All Checks Passed`, that passes only when
# every other check on the PR head (or merge-queue head) finished success,
# skipped or neutral. Keep it dedicated: all runs of this file are excluded
# so the gate never waits on itself. Retry recovery is manual and fail-closed;
# a recovered producer does not automatically rerun a previously failed gate.

'on':
  push:
    branches: [main]
  pull_request:
    # Union of peer PR activities, including title/body/base edits.
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:

permissions: {}

concurrency:
  # Keep each main-push proof; same-head PR edits refresh the pending gate.
  group: >-
    all-checks-gate-${{ github.event.pull_request.number
    || (github.event_name == 'push' && github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-all-checks-gate.yml@0c373f1252e0fe23a1e119df639b51d63b02b7d8 # v0.116.3
    with:
      egress-policy: block
      # On a push to main only, leave out the tag publish run that a release
      # commit carries (#422). Its PyPI upload waits for a person to approve
      # the pypi environment, and a waiting run kept this gate pending until
      # it timed out and turned main red. The reusable drops a workflow run
      # whose name matches, together with its check runs. Pull requests and
      # the merge queue get an empty pattern, so they gate everything as
      # before; publish never runs on them anyway.
      ignore-checks: >-
        ${{ github.event_name == 'push'
        && '^Publish - PyPI Production$' || '' }}
    permissions:
      actions: read
      checks: read
      contents: read
      statuses: read
