---
name: Release - Auto Tag

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-auto-tag-${{ github.repository }}
  cancel-in-progress: false

jobs:
  auto-tag:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-release-auto-tag.yml@614c5ad1fc91d742baed959643bdd1f261a71210 # v0.79.1
    with:
      create-release: false
      tooling-ref: '614c5ad1fc91d742baed959643bdd1f261a71210' # v0.79.1
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      egress-preset: github-tooling
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      # read: report-release-failure job reads workflow metadata
      actions: read
      # write: create version tags on the repository
      contents: write
      # write: report-release-failure opens deduplicated failure issues
      issues: write
