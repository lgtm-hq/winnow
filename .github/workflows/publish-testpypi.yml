---
name: Publish - TestPyPI Staging

# Layout: lgtm-ci docs/python-release-publish.md (v0.41.0+)

'on':
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-testpypi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pypi-build:
    name: Build Python distribution
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-build-python-dist.yml@9ea778eb4e6b876d60b7b3d7d0d0aee5182717bb # v0.78.0
    permissions:
      # read: checkout and build sdist/wheel (reusable-build-python-dist)
      contents: read
      # write: build-provenance attestation of dist/* (attest defaults to
      # true); reusable-build-python-dist @ v0.77.5 declares both scopes
      # statically, so they must be granted even with attest: false.
      id-token: write
      attestations: write
    with:
      python-version: '3.13'
      verify-tag-version: false
      ensure-tag-on-default-branch: false
      artifact-name: python-dist
      tooling-ref: '9ea778eb4e6b876d60b7b3d7d0d0aee5182717bb' # v0.78.0
      egress-policy: block
      # Full allowlist (python-dist preset + project extras): at v0.77.5
      # harden-runner enforces the caller's allowed-endpoints literally
      # (its pre hook cannot see resolved preset output), so partial
      # append lists would block checkout.
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        pipelines.actions.githubusercontent.com:443
        pypi.org:443
        files.pythonhosted.org:443
        test.pypi.org:443
        upload.pypi.org:443
        upload.test.pypi.org:443
        astral.sh:443
        releases.astral.sh:443
        github-releases.githubusercontent.com:443
        release-assets.githubusercontent.com:443
        fulcio.sigstore.dev:443
        rekor.sigstore.dev:443
        timestamp.sigstore.dev:443
        tuf-repo-cdn.sigstore.dev:443
        tuf-repo.github.com:443
        sigstore-tuf-root.storage.googleapis.com:443
        oauth2.sigstore.dev:443

  pypi-upload:
    name: Upload to TestPyPI
    needs: [pypi-build]
    runs-on: ubuntu-latest
    # Must match TestPyPI trusted publisher environment (same pattern as production
    # `environment: pypi`). Auto-created in GitHub if missing.
    environment: testpypi
    permissions:
      # read: download python-dist workflow artifact
      contents: read
      # write: OIDC JWT for TestPyPI trusted publishing (this workflow file)
      id-token: write
      # write: Sigstore provenance attestation after upload (best-effort)
      attestations: write
    steps:
      - name: Harden runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          # lgtm-ci workflow-contract.md § PyPI upload (OIDC)
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            pypi.org:443
            upload.pypi.org:443
            files.pythonhosted.org:443
            test.pypi.org:443
            upload.test.pypi.org:443
            astral.sh:443
            releases.astral.sh:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
            oauth2.sigstore.dev:443
      - name: Prepare PyPI upload
        id: prepare
        # yamllint disable-line rule:line-length
        uses: lgtm-hq/lgtm-ci/.github/actions/prepare-pypi-upload@9ea778eb4e6b876d60b7b3d7d0d0aee5182717bb # v0.78.0
        with:
          artifact-name: python-dist
          python-version: '3.13'
          tooling-ref: '9ea778eb4e6b876d60b7b3d7d0d0aee5182717bb' # v0.78.0
      - name: Upload to TestPyPI
        # yamllint disable-line rule:line-length
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: ${{ steps.prepare.outputs.dist-path }}
      - name: Attest build provenance
        continue-on-error: true
        # yamllint disable-line rule:line-length
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.prepare.outputs.dist-path }}/*
