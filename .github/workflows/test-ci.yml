# SPDX-License-Identifier: MIT
---
name: CI - Tests

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: test-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Compat mode: multi-version matrix, no coverage or PR comments
  # (workflow-contract § Compat vs coverage contract, #340).
  # Org ruleset (checks-winnow): test / Python Compatibility
  #                              test / Aggregate Python Results
  test:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-python.yml@66cad82ead0e5d119928c895c7d7da9c837989e5 # v0.52.3
    with:
      publish-test-summary: false
      python-versions: '3.11,3.12,3.13'
      test-path: tests
      coverage: false
      extra-args: '--override-ini=addopts=--strict-markers --strict-config'
      draft-pr-skip: true
      job-name: Python Compatibility
      runner-image: ubuntu-24.04
      tooling-ref: '66cad82ead0e5d119928c895c7d7da9c837989e5' # v0.52.3
      egress-policy: block
      egress-preset: quality
    permissions:
      # write: merge matrix artifacts and update workflow summaries
      actions: write
      # read: checkout repository and install dependencies
      contents: read
      # write: required by the reusable's publish-test-summary job at parse
      # time even though summaries are disabled in compat mode
      pull-requests: write

  # Coverage mode: single version with coverage reporting and PR summary
  test-coverage:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-python.yml@66cad82ead0e5d119928c895c7d7da9c837989e5 # v0.52.3
    with:
      publish-test-summary: true
      python-version: '3.13'
      test-path: tests
      coverage: true
      coverage-format: json
      coverage-threshold: 85
      upload-coverage: true
      extra-args: '--override-ini=addopts=--strict-markers --strict-config'
      draft-pr-skip: true
      job-name: Python Coverage
      runner-image: ubuntu-24.04
      tooling-ref: '66cad82ead0e5d119928c895c7d7da9c837989e5' # v0.52.3
      egress-policy: block
      egress-preset: quality
    permissions:
      # write: merge coverage artifacts and update workflow summaries
      actions: write
      # read: checkout repository and install dependencies
      contents: read
      # write: post test results and coverage comments on PRs
      pull-requests: write

  publish-coverage:
    name: Publish Coverage to Pages
    needs: test-coverage
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.test-coverage.outputs.passed == 'true'
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-python-publish.yml@66cad82ead0e5d119928c895c7d7da9c837989e5 # v0.52.3
    with:
      coverage-percent: ${{ needs.test-coverage.outputs.coverage-percent }}
      upload-coverage: true
      job-name: Deploy Coverage to Pages
      runner-image: ubuntu-24.04
      tooling-ref: '66cad82ead0e5d119928c895c7d7da9c837989e5' # v0.52.3
      egress-policy: block
      egress-preset: github-pages
    permissions:
      # read: download coverage artifacts from the test job
      contents: read
      # write: publish coverage report to GitHub Pages
      pages: write
      # write: OIDC token for Pages deployment
      id-token: write
