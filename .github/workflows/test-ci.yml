# SPDX-License-Identifier: MIT
---
name: CI - Tests

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: test-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Compat mode: multi-version matrix, no coverage or PR comments
  # (workflow-contract § Compat vs coverage contract, #340).
  # Org ruleset (checks-winnow): test / 🧪 Python Compatibility
  #                              test / Aggregate Python Results
  test:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-python.yml@0c373f1252e0fe23a1e119df639b51d63b02b7d8 # v0.116.3
    with:
      publish-test-summary: false
      python-versions: '3.11,3.12,3.13,3.14,3.15'
      # Distinct artifact prefixes (lgtm-ci v0.76 #1091): artifacts are named
      # <prefix>-results-<version> and <prefix>-coverage. Both calls run 3.13,
      # so the shared default prefix `python` would let one call's results
      # overwrite the other's.
      artifact-prefix: compat
      test-path: tests
      coverage: false
      # Overrides addopts to drop '-m "not integration"': CI runs the full
      # suite; locally integration tests are opt-in (make test-integration).
      extra-args: '--override-ini=addopts=--strict-markers --strict-config'
      draft-pr-skip: true
      job-name: '🧪 Python Compatibility'
      runner-image: ubuntu-26.04
      tooling-ref: '0c373f1252e0fe23a1e119df639b51d63b02b7d8' # v0.116.3
      egress-policy: block
    permissions:
      # write: merge matrix artifacts and update workflow summaries
      actions: write
      # read: checkout repository and install dependencies
      contents: read
      # write: required by the reusable's publish-test-summary job at parse
      # time even though summaries are disabled in compat mode
      pull-requests: write

  # macOS leg (#375): the full suite, integration tests included, on the
  # oldest and newest supported Python, so the platform branches in winnow
  # and its tests run somewhere. A direct job, as #375 prescribes for when
  # the lgtm-ci reusable cannot run on macOS: at v0.116.3 its aggregate job
  # needs coreutils `timeout`, which hosted macOS lacks (seen on #476). There
  # is no ruleset entry for it: the all-checks gate fails on any failed check
  # on the head, which includes each `🍎 macOS (Python <version>)` leg.
  #
  # EGRESS EXCEPTION: egress is NOT enforced on this job. It runs no
  # harden-runner: lgtm-ci's verify step does not enforce on macOS (it passes
  # with a notice), and its reusable cannot run here at v0.116.3. So the job
  # holds no secrets, no id-token and only contents: read, persists no
  # checkout credentials, uploads nothing, and nothing needs it but the
  # failure notifier: it feeds neither publish-coverage nor any release path.
  test-macos:
    name: '🍎 macOS (Python ${{ matrix.python-version }})'
    # Skip drafts like the Linux calls (draft-pr-skip: true);
    # ready_for_review runs it.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.draft == false
    # Pinned GitHub-hosted macOS 26 (arm64), not the moving macos-latest.
    runs-on: macos-26
    # A leg took under 5 minutes on #476.
    timeout-minutes: 20
    permissions:
      # read: check out the repository
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.15']
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # The uv the Dockerfile copies in.
          version: '0.13.10'
          # Sets UV_PYTHON for every uv command below.
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - name: Install dependencies
        run: uv sync --frozen --dev
      - name: Run tests
        # The compat call's test path and extra-args: the override drops
        # '-m "not integration"', so the integration test runs too.
        run: >-
          uv run --frozen pytest tests
          --override-ini=addopts=--strict-markers --strict-config

  # Coverage mode: single version with coverage reporting and PR summary
  test-coverage:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-python.yml@0c373f1252e0fe23a1e119df639b51d63b02b7d8 # v0.116.3
    with:
      publish-test-summary: true
      # Keep up to three earlier runs under "Previous runs" (lgtm-ci #1346).
      comment-history: true
      comment-history-limit: 3
      python-version: '3.13'
      artifact-prefix: coverage
      test-path: tests
      coverage: true
      coverage-format: json
      coverage-threshold: 85
      upload-coverage: true
      # Overrides addopts to drop '-m "not integration"': CI runs the full
      # suite; locally integration tests are opt-in (make test-integration).
      extra-args: '--override-ini=addopts=--strict-markers --strict-config'
      draft-pr-skip: true
      job-name: Python Coverage
      runner-image: ubuntu-26.04
      tooling-ref: '0c373f1252e0fe23a1e119df639b51d63b02b7d8' # v0.116.3
      egress-policy: block
    permissions:
      # write: merge coverage artifacts and update workflow summaries
      actions: write
      # read: checkout repository and install dependencies
      contents: read
      # write: post test results and coverage comments on PRs
      pull-requests: write

  publish-coverage:
    name: Publish Coverage to Pages
    needs: [test, test-coverage]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.test.outputs.passed == 'true' &&
      needs.test-coverage.outputs.passed == 'true'
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-python-publish.yml@0c373f1252e0fe23a1e119df639b51d63b02b7d8 # v0.116.3
    with:
      coverage-percent: ${{ needs.test-coverage.outputs.coverage-percent }}
      # Must match test-coverage's artifact-prefix: downloads <prefix>-coverage.
      artifact-prefix: coverage
      upload-coverage: true
      job-name: Deploy Coverage to Pages
      runner-image: ubuntu-26.04
      tooling-ref: '0c373f1252e0fe23a1e119df639b51d63b02b7d8' # v0.116.3
      egress-policy: block
      egress-preset: github-pages
    permissions:
      # read: download coverage artifacts from the test job
      contents: read
      # write: publish coverage report to GitHub Pages
      pages: write
      # write: OIDC token for Pages deployment
      id-token: write
      # write: delete stale same-run Pages artifacts on rerun (lgtm-ci#415)
      actions: write

  # Durable failure report for main pushes and scheduled runs (#356): the
  # first failed, cancelled or timed-out run opens one issue per workflow key,
  # later ones comment on it. Needs every job above. Pull requests, merge
  # queues, tags and manual runs never report here.
  #
  # The condition is shared by every notify-failure job. A job that hits
  # timeout-minutes concludes cancelled: failure() stays false for it, and
  # cancelled() is true only when the whole run was cancelled, so
  # failure() || cancelled() missed timeouts. always() makes this job
  # evaluate its own condition whatever the needed jobs did (and keeps it
  # running when the run is cancelled); the needs.*.result clauses then
  # decide. needs.<job>.result is success, failure, cancelled or skipped, so
  # an intended skip and a green run stay quiet.
  notify-failure:
    needs: [test, test-macos, test-coverage, publish-coverage]
    if: >-
      always()
      && (contains(needs.*.result, 'failure')
      || contains(needs.*.result, 'cancelled'))
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'schedule')
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-main-failure-notifier.yml@0c373f1252e0fe23a1e119df639b51d63b02b7d8 # v0.116.3
    permissions:
      # read: list the run's jobs and steps for the issue body
      actions: read
      # read: repository context for the issue body
      contents: read
      # write: open or comment on the deduplicated failure issue
      issues: write
    with:
      workflow-key: test-ci
      egress-policy: block
