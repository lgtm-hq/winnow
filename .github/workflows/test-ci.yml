# SPDX-License-Identifier: MIT
---
name: CI - Tests

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: test-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-python.yml@cecca744299be6a34f3b4ea4f18c00262081ab61 # v0.41.0
    with:
      publish-test-summary: true
      python-versions: '3.11,3.12,3.13'
      test-path: tests
      coverage: true
      coverage-format: xml
      coverage-threshold: 85
      upload-coverage: true
      draft-pr-skip: true
      job-name: Python Compatibility
      runner-image: ubuntu-24.04
      tooling-ref: 'cecca744299be6a34f3b4ea4f18c00262081ab61' # v0.41.0
      egress-policy: block
      egress-preset: quality
    permissions:
      # write: merge matrix artifacts and update workflow summaries
      actions: write
      # read: checkout repository and install dependencies
      contents: read
      # write: post test results and coverage comments on PRs
      pull-requests: write

  # Org ruleset (checks-winnow): test-suite-coverage / 🧪 Test Suite & Coverage
  test-suite-coverage:
    needs: test
    if: >-
      always() &&
      (
        github.event_name != 'pull_request' ||
        github.event.pull_request.draft == false
      )
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-required-check.yml@cecca744299be6a34f3b4ea4f18c00262081ab61 # v0.41.0
    permissions:
      contents: read
    with:
      tooling-ref: 'cecca744299be6a34f3b4ea4f18c00262081ab61' # v0.41.0
      job-name: '🧪 Test Suite & Coverage'
      runner-image: ubuntu-24.04
      upstream-result: ${{ needs.test.result }}
      passed-output: ${{ needs.test.outputs.passed }}
      egress-policy: block
      egress-preset: github-tooling

  publish-coverage:
    name: Publish Coverage to Pages
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.test.outputs.passed == 'true'
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-python-publish.yml@cecca744299be6a34f3b4ea4f18c00262081ab61 # v0.41.0
    with:
      coverage-percent: ${{ needs.test.outputs.coverage-percent }}
      upload-coverage: true
      job-name: Deploy Coverage to Pages
      runner-image: ubuntu-24.04
      tooling-ref: 'cecca744299be6a34f3b4ea4f18c00262081ab61' # v0.41.0
      egress-policy: block
      egress-preset: github-pages
    permissions:
      # read: download coverage artifacts from the test job
      contents: read
      # write: publish coverage report to GitHub Pages
      pages: write
      # write: OIDC token for Pages deployment
      id-token: write
