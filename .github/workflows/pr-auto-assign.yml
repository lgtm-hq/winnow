---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@d990149fa4189262a41abc706c35271c098b2807 # v0.99.0
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: 'd990149fa4189262a41abc706c35271c098b2807' # v0.99.0
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
