---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@d9e2ca3a4a7646bf7b4a810567db65a781267ce6 # v0.116.5
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: 'd9e2ca3a4a7646bf7b4a810567db65a781267ce6' # v0.116.5
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
