---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@39514a688ee00cdc2a82cdd13310ee1ee36b84c2 # v0.85.0
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: '39514a688ee00cdc2a82cdd13310ee1ee36b84c2' # v0.85.0
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
