---
name: Release - Version PR

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-version-pr-${{ github.repository }}
  cancel-in-progress: false

jobs:
  version-pr:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-release-version-pr.yml@43325346d688be984d6bde155603d18fbdd89278 # v0.33.0
    with:
      ecosystems: python
      auto-merge: true
      max-bump: minor
      tooling-ref: '43325346d688be984d6bde155603d18fbdd89278' # v0.33.0
      egress-policy: block
      egress-preset: pypi
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      # write: push version bump commits to release branches
      contents: write
      # write: open and update automated release PRs
      pull-requests: write
