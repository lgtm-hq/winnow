---
name: Release - Version PR

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-version-pr-${{ github.repository }}
  cancel-in-progress: false

jobs:
  version-pr:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-release-version-pr.yml@cecca744299be6a34f3b4ea4f18c00262081ab61 # v0.41.0
    with:
      ecosystems: python
      auto-merge: true
      # Allow MAJOR bumps so pyproject.toml stays aligned with release-auto-tag
      # (breaking commits must not be clamped to minor-only).
      max-bump: major
      # Patch releases auto-merge; minor/major need explicit review.
      auto-merge-patch-only: true
      tooling-ref: 'cecca744299be6a34f3b4ea4f18c00262081ab61' # v0.41.0
      egress-policy: block
      egress-preset: pypi
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      # write: push version bump commits to release branches
      contents: write
      # write: open and update automated release PRs
      pull-requests: write
