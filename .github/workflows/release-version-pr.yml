---
name: Release - Version PR

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-version-pr-${{ github.repository }}
  cancel-in-progress: false

jobs:
  version-pr:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-release-version-pr.yml@0c373f1252e0fe23a1e119df639b51d63b02b7d8 # v0.116.3
    with:
      ecosystems: python
      auto-merge: true
      # Allow MAJOR bumps so pyproject.toml stays aligned with release-auto-tag
      # (breaking commits must not be clamped to minor-only).
      max-bump: major
      # Patch releases auto-merge; minor/major need explicit review.
      auto-merge-patch-only: true
      tooling-ref: '0c373f1252e0fe23a1e119df639b51d63b02b7d8' # v0.116.3
      egress-policy: block
      # github-minimal plus the hosts below: the same nine hosts as the old
      # hand-written list (#465). The default release-version-pr preset would
      # add release-assets.githubusercontent.com and four Rust hosts.
      # - raw.githubusercontent.com: kept from the old list (not called in
      #   main runs 45247358964 or 45228243674).
      # - uploads.github.com: kept from the old list (GitHub upload API; not
      #   called in those runs).
      # - pypi.org: the Python version updater installs a package (called by
      #   python3.14 in run 45247358964).
      # - files.pythonhosted.org: that package's download (same run).
      egress-preset: github-minimal
      allowed-endpoints-mode: append
      allowed-endpoints: >
        raw.githubusercontent.com:443
        uploads.github.com:443
        pypi.org:443
        files.pythonhosted.org:443
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      # read: report-release-failure job reads workflow metadata
      actions: read
      # write: push version bump commits to release branches
      contents: write
      # write: report-release-failure opens deduplicated failure issues
      issues: write
      # write: open and update automated release PRs
      pull-requests: write
