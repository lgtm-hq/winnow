---
name: Release - Version PR

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-version-pr-${{ github.repository }}
  cancel-in-progress: false

jobs:
  version-pr:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-release-version-pr.yml@f8f58587e4c324f6f0c9b3b4f59cfc93aa7d5d0f # v0.69.6
    with:
      ecosystems: python
      auto-merge: true
      # Allow MAJOR bumps so pyproject.toml stays aligned with release-auto-tag
      # (breaking commits must not be clamped to minor-only).
      max-bump: major
      # Patch releases auto-merge; minor/major need explicit review.
      auto-merge-patch-only: true
      tooling-ref: 'f8f58587e4c324f6f0c9b3b4f59cfc93aa7d5d0f' # v0.69.6
      egress-policy: block
      # Retained intentionally for when lgtm-ci resolves presets before
      # harden-runner; currently overridden by the explicit list below.
      egress-preset: pypi
      # Full allowlist (pypi preset + project extras): at v0.69.6
      # harden-runner enforces the caller's allowed-endpoints literally
      # (its pre hook cannot see resolved preset output), so partial
      # append lists would block checkout.
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        uploads.github.com:443
        pipelines.actions.githubusercontent.com:443
        pypi.org:443
        files.pythonhosted.org:443
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      # read: report-release-failure job reads workflow metadata
      actions: read
      # write: push version bump commits to release branches
      contents: write
      # write: report-release-failure opens deduplicated failure issues
      issues: write
      # write: open and update automated release PRs
      pull-requests: write
